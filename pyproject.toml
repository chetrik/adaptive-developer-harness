[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-developer-harness"
version = "0.2.0"
description = "Repository-driven deterministic Developer Harness generator"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.26.0", "PyYAML==6.0.3"]

[tool.setuptools]
packages = ["adaptive_harness"]
